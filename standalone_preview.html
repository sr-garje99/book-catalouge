<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ग्रंथालय पुस्तक सूची - Library Catalog & Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #0ea5e9;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.08);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Mukta', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      color: white;
      padding: 2rem 1.5rem 1.8rem;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-icon svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #38bdf8;
      stroke-width: 2;
    }

    .brand-text h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .badge-count {
      background: #38bdf8;
      color: #0f172a;
      font-size: 0.8rem;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-weight: 700;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      font-family: inherit;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      background: white;
      border-radius: 12px;
      padding: 0.35rem 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      flex: 1;
      gap: 0.6rem;
      padding-left: 0.6rem;
    }

    .search-icon {
      width: 20px;
      height: 20px;
      color: #94a3b8;
    }

    .search-input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 1rem;
      color: var(--text);
      font-family: inherit;
    }

    .filter-select {
      border: none;
      outline: none;
      background: #f1f5f9;
      color: #334155;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 0.25rem;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 0.35rem;
      display: flex;
      align-items: center;
      border-radius: 50%;
    }

    .clear-btn:hover {
      color: #334155;
      background: #f1f5f9;
    }

    .main-container {
      max-width: 1280px;
      margin: 1.5rem auto 3rem;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.75rem;
    }

    @media (max-width: 960px) {
      .main-container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        margin-bottom: 1rem;
        position: static !important;
      }
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.25rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      height: fit-content;
      position: sticky;
      top: 140px;
    }

    .sidebar-title {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #475569;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reset-link {
      font-size: 0.78rem;
      color: var(--primary);
      cursor: pointer;
      text-transform: none;
      font-weight: 600;
    }

    .reset-link:hover { text-decoration: underline; }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .category-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: #334155;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      font-family: inherit;
    }

    .category-btn:hover {
      background: #f1f5f9;
      color: var(--primary);
    }

    .category-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }

    .category-pill {
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      background: #e2e8f0;
      color: #475569;
      font-weight: 600;
    }

    .category-btn.active .category-pill {
      background: var(--primary);
      color: white;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .results-count {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .results-count strong {
      color: var(--text);
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .sort-select {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .book-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      position: relative;
      cursor: pointer;
    }

    .book-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .acc-number {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      background: #f1f5f9;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }

    .subject-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
    }

    .badge-charitra { background: #fef3c7; color: #b45309; }
    .badge-kadambari { background: #fce7f3; color: #be185d; }
    .badge-katha { background: #ede9fe; color: #6d28d9; }
    .badge-itihas { background: #ffedd5; color: #c2410c; }
    .badge-pravas { background: #ccfbf1; color: #0f766e; }
    .badge-arthashastra { background: #dcfce7; color: #15803d; }
    .badge-dharm { background: #fae8ff; color: #86198f; }
    .badge-english { background: #e0e7ff; color: #3730a3; }
    .badge-default { background: #e2e8f0; color: #334155; }

    .book-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-author {
      font-size: 0.88rem;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: auto;
      padding-top: 0.85rem;
      border-top: 1px dashed var(--border);
      font-size: 0.78rem;
      color: #64748b;
    }

    .meta-tag {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #059669;
      margin-left: auto;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.45rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    .page-btn {
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--border);
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .page-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .page-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-card {
      background: white;
      border-radius: 16px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: modalIn 0.18s ease-out;
    }

    @keyframes modalIn {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      color: white;
      padding: 1.5rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .modal-close:hover { background: rgba(255, 255, 255, 0.3); }

    .modal-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .modal-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      font-size: 0.92rem;
      gap: 0.5rem;
    }

    .modal-label { color: #64748b; font-weight: 600; }
    .modal-val { color: #0f172a; font-weight: 500; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: #64748b;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #0f172a;
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.88rem;
      box-shadow: var(--shadow-lg);
      z-index: 120;
    }
  </style>
</head>

  <!-- Pure vanilla reactive implementation as robust offline runner and React loader -->
  <script>
    (function() {
      // Self-contained vanilla reactive engine that runs whether online or completely offline!
      let state = {
        books: window.INITIAL_LIBRARY_DATA || [],
        searchTerm: '',
        searchField: 'all',
        selectedSubject: 'all',
        sortBy: 'relevance',
        currentPage: 1,
        pageSize: 24,
        activeBook: null,
        toastMsg: ''
      };

      function setState(patch) {
        state = Object.assign({}, state, patch);
        renderApp();
      }

      function showToast(msg) {
        state.toastMsg = msg;
        renderApp();
        setTimeout(function() {
          if (state.toastMsg === msg) {
            state.toastMsg = '';
            renderApp();
          }
        }, 3000);
      }

      function getBadgeClass(subj) {
        if (!subj) return 'badge-default';
        if (subj.indexOf('चरित्र') !== -1) return 'badge-charitra';
        if (subj.indexOf('कादंबरी') !== -1) return 'badge-kadambari';
        if (subj.indexOf('कथा') !== -1) return 'badge-katha';
        if (subj.indexOf('इतिहास') !== -1) return 'badge-itihas';
        if (subj.indexOf('प्रवास') !== -1) return 'badge-pravas';
        if (subj.indexOf('अर्थशास्त्र') !== -1) return 'badge-arthashastra';
        if (subj.indexOf('धर्म') !== -1) return 'badge-dharm';
        if (subj.indexOf('इंग्रजी') !== -1) return 'badge-english';
        return 'badge-default';
      }

      function getSubjectCounts(books) {
        const counts = {};
        for (let i = 0; i < books.length; i++) {
          const s = books[i].subject || 'इतर';
          counts[s] = (counts[s] || 0) + 1;
        }
        return counts;
      }

      function getFilteredBooks() {
        let list = state.books;
        if (state.selectedSubject !== 'all') {
          list = list.filter(function(b) { return b.subject === state.selectedSubject; });
        }
        if (state.searchTerm.trim()) {
          const q = state.searchTerm.toLowerCase().trim();
          list = list.filter(function(b) {
            const titleMatch = (b.title || '').toLowerCase().indexOf(q) !== -1;
            const authorMatch = (b.author || '').toLowerCase().indexOf(q) !== -1;
            const idMatch = (b.id || '').toLowerCase().indexOf(q) !== -1;
            const subjMatch = (b.subject || '').toLowerCase().indexOf(q) !== -1;
            const remMatch = (b.remarks || '').toLowerCase().indexOf(q) !== -1;

            if (state.searchField === 'title') return titleMatch;
            if (state.searchField === 'author') return authorMatch;
            if (state.searchField === 'id') return idMatch;
            if (state.searchField === 'subject') return subjMatch;
            return titleMatch || authorMatch || idMatch || subjMatch || remMatch;
          });
        }

        const sorted = list.slice();
        if (state.sortBy === 'title-asc') {
          sorted.sort(function(a, b) { return (a.title || '').localeCompare(b.title || ''); });
        } else if (state.sortBy === 'title-desc') {
          sorted.sort(function(a, b) { return (b.title || '').localeCompare(a.title || ''); });
        } else if (state.sortBy === 'id-asc') {
          sorted.sort(function(a, b) { return (parseInt(a.id) || 0) - (parseInt(b.id) || 0); });
        } else if (state.sortBy === 'id-desc') {
          sorted.sort(function(a, b) { return (parseInt(b.id) || 0) - (parseInt(a.id) || 0); });
        } else if (state.sortBy === 'pages-desc') {
          sorted.sort(function(a, b) { return (b.pages || 0) - (a.pages || 0); });
        }
        return sorted;
      }

      function safeJsonParse(text) {
        if (typeof text !== 'string') return text;
        const sanitized = text
          .replace(/:\s*NaN\b/g, ': null')
          .replace(/:\s*Infinity\b/g, ': null')
          .replace(/:\s*-Infinity\b/g, ': null');
        return JSON.parse(sanitized);
      }

      function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const raw = safeJsonParse(evt.target.result);
            if (!Array.isArray(raw)) {
              alert('JSON फाईल अरे (Array) स्वरूपात असावी.');
              return;
            }
            const normalized = raw.map(function(item) {
              if ('Unnamed: 1' in item) {
                const acc_keys = Object.keys(item).filter(function(k) { return k.includes('Pune Marathi') || k.includes('Accession'); });
                const acc = acc_keys.length ? item[acc_keys[0]] : item['AccessionNumber'];
                let subj = String(item['Unnamed: 5'] || 'इतर').trim();
                if (subj === 'ार्म') subj = 'धर्म';
                return {
                  id: String(acc || '').trim(),
                  title: String(item['Unnamed: 1'] || '').replaceAll('*', '').trim(),
                  author: String(item['Unnamed: 2'] || 'अज्ञात').trim(),
                  subject: subj,
                  status: String(item['Unnamed: 4'] || 'उपलब्ध').trim(),
                  remarks: String(item['Unnamed: 3'] || '').trim(),
                  pages: item['noofpages'] ? parseInt(item['noofpages']) : null
                };
              } else {
                let subj = String(item.subject || 'इतर').trim();
                if (subj === 'ार्म') subj = 'धर्म';
                return {
                  id: String(item.AccessionNumber || '').trim(),
                  title: String(item.Bookname || '').replaceAll('*', '').trim(),
                  author: String(item.Author || 'अज्ञात').trim(),
                  subject: subj,
                  status: String(item.currentstatus || 'उपलब्ध').trim(),
                  remarks: String(item.remarks || '').trim(),
                  pages: item.noofpages ? parseInt(item.noofpages) : null
                };
              }
            }).filter(function(b) { return b.title && b.id && b.title !== 'Bookname'; });

            setState({ books: normalized, currentPage: 1 });
            showToast('यशस्वी! ' + normalized.length.toLocaleString('en-IN') + ' पुस्तके लोड झाली.');
          } catch (err) {
            alert('JSON वाचताना त्रुटी आली: ' + err.message);
          }
        };
        reader.readAsText(file);
      }

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function renderApp() {
        const root = document.getElementById('root');
        if (!root) return;

        const filtered = getFilteredBooks();
        const counts = getSubjectCounts(state.books);
        const sortedSubjectList = Object.keys(counts).map(function(k) { return [k, counts[k]]; })
          .sort(function(a, b) { return b[1] - a[1]; });

        const totalPages = Math.ceil(filtered.length / state.pageSize) || 1;
        const page = Math.min(Math.max(1, state.currentPage), totalPages);
        const startIndex = (page - 1) * state.pageSize;
        const currentSlice = filtered.slice(startIndex, startIndex + state.pageSize);

        let html = '';

        // Header
        html += '<header>';
        html += '  <div class="header-container">';
        html += '    <div class="header-top">';
        html += '      <div class="brand">';
        html += '        <div class="brand-icon">';
        html += '          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>';
        html += '        </div>';
        html += '        <div class="brand-text">';
        html += '          <h1>ग्रंथालय पुस्तक सूची (Library Catalog)</h1>';
        html += '          <p>पुणे मराठी ग्रंथालय • डिजिटल शोध पोर्टल</p>';
        html += '        </div>';
        html += '      </div>';
        html += '      <div class="header-actions">';
        html += '        <span class="badge-count">' + state.books.length.toLocaleString('en-IN') + ' पुस्तके</span>';
        html += '        <label class="btn btn-secondary">';
        html += '          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>';
        html += '          JSON फाईल लोड करा';
        html += '          <input id="fileUploadInput" type="file" accept=".json" style="display:none" />';
        html += '        </label>';
        html += '      </div>';
        html += '    </div>';

        // Search Bar
        html += '    <div class="search-box">';
        html += '      <div class="search-input-wrapper">';
        html += '        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
        html += '        <input id="searchInput" type="text" class="search-input" placeholder="पुस्तकाचे नाव, लेखक, नोंदणी क्रमांक (Accession No) शोधा..." value="' + escapeHtml(state.searchTerm) + '">';
        if (state.searchTerm) {
          html += '      <button id="clearSearchBtn" class="clear-btn" title="Clear">✕</button>';
        }
        html += '      </div>';
        html += '      <select id="searchFieldSelect" class="filter-select">';
        html += '        <option value="all"' + (state.searchField === 'all' ? ' selected' : '') + '>सर्व क्षेत्रे (All Fields)</option>';
        html += '        <option value="title"' + (state.searchField === 'title' ? ' selected' : '') + '>पुस्तकाचे नाव (Title)</option>';
        html += '        <option value="author"' + (state.searchField === 'author' ? ' selected' : '') + '>लेखक (Author)</option>';
        html += '        <option value="id"' + (state.searchField === 'id' ? ' selected' : '') + '>नोंदणी क्रमांक (Acc No)</option>';
        html += '        <option value="subject"' + (state.searchField === 'subject' ? ' selected' : '') + '>विषय (Subject)</option>';
        html += '      </select>';
        html += '    </div>';
        html += '  </div>';
        html += '</header>';

        // Main
        html += '<main class="main-container">';
        
        // Sidebar
        html += '  <aside class="sidebar">';
        html += '    <div class="sidebar-title">';
        html += '      <span>विषय वर्गवारी (Categories)</span>';
        if (state.selectedSubject !== 'all') {
          html += '    <span id="resetCategoryLink" class="reset-link">सर्व पहा</span>';
        }
        html += '    </div>';
        html += '    <div class="category-list">';
        html += '      <button class="category-btn' + (state.selectedSubject === 'all' ? ' active' : '') + '" data-subject="all">';
        html += '        <span>सर्व विषय</span>';
        html += '        <span class="category-pill">' + state.books.length + '</span>';
        html += '      </button>';
        sortedSubjectList.forEach(function(item) {
          const s = item[0];
          const count = item[1];
          html += '    <button class="category-btn' + (state.selectedSubject === s ? ' active' : '') + '" data-subject="' + escapeHtml(s) + '">';
          html += '      <span>' + escapeHtml(s) + '</span>';
          html += '      <span class="category-pill">' + count + '</span>';
          html += '    </button>';
        });
        html += '    </div>';
        html += '  </aside>';

        // Content
        html += '  <section>';
        html += '    <div class="controls-bar">';
        html += '      <div class="results-count">';
        html += '        एकूण पुस्तके: <strong>' + filtered.length.toLocaleString('en-IN') + '</strong>';
        if (state.selectedSubject !== 'all') {
          html += '      • विषय: <em>' + escapeHtml(state.selectedSubject) + '</em>';
        }
        if (state.searchTerm) {
          html += '      • शोध: "<em>' + escapeHtml(state.searchTerm) + '</em>"';
        }
        html += '      </div>';

        html += '      <div class="sort-group">';
        html += '        <label for="sortSelect">क्रमवारी:</label>';
        html += '        <select id="sortSelect" class="sort-select">';
        html += '          <option value="relevance"' + (state.sortBy === 'relevance' ? ' selected' : '') + '>मूळ क्रम (Default)</option>';
        html += '          <option value="title-asc"' + (state.sortBy === 'title-asc' ? ' selected' : '') + '>नाव (अ ते ज्ञ / A-Z)</option>';
        html += '          <option value="title-desc"' + (state.sortBy === 'title-desc' ? ' selected' : '') + '>नाव (Z-A)</option>';
        html += '          <option value="id-asc"' + (state.sortBy === 'id-asc' ? ' selected' : '') + '>क्रमांक (लहान ते मोठा)</option>';
        html += '          <option value="id-desc"' + (state.sortBy === 'id-desc' ? ' selected' : '') + '>क्रमांक (मोठा ते लहान)</option>';
        html += '          <option value="pages-desc"' + (state.sortBy === 'pages-desc' ? ' selected' : '') + '>पृष्ठसंख्या (जास्त ते कमी)</option>';
        html += '        </select>';
        html += '        <select id="pageSizeSelect" class="sort-select">';
        html += '          <option value="12"' + (state.pageSize === 12 ? ' selected' : '') + '>12 प्रति पान</option>';
        html += '          <option value="24"' + (state.pageSize === 24 ? ' selected' : '') + '>24 प्रति पान</option>';
        html += '          <option value="48"' + (state.pageSize === 48 ? ' selected' : '') + '>48 प्रति पान</option>';
        html += '          <option value="96"' + (state.pageSize === 96 ? ' selected' : '') + '>96 प्रति पान</option>';
        html += '        </select>';
        html += '      </div>';
        html += '    </div>';

        // Grid
        if (currentSlice.length > 0) {
          html += '    <div class="books-grid">';
          currentSlice.forEach(function(b, idx) {
            html += '      <div class="book-card" data-idx="' + (startIndex + idx) + '">';
            html += '        <div>';
            html += '          <div class="card-top">';
            html += '            <span class="acc-number">#' + escapeHtml(b.id) + '</span>';
            html += '            <span class="subject-badge ' + getBadgeClass(b.subject) + '">' + escapeHtml(b.subject) + '</span>';
            html += '          </div>';
            html += '          <h3 class="book-title" title="' + escapeHtml(b.title) + '">' + escapeHtml(b.title) + '</h3>';
            html += '          <p class="book-author">';
            html += '            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';
            html += '            <span>' + escapeHtml(b.author || 'अज्ञात') + '</span>';
            html += '          </p>';
            html += '        </div>';

            html += '        <div class="card-meta">';
            if (b.pages) {
              html += '          <span class="meta-tag">📖 ' + b.pages + ' पाने</span>';
            }
            if (b.remarks && b.remarks !== '---') {
              const remShort = b.remarks.length > 18 ? b.remarks.slice(0, 18) + '...' : b.remarks;
              html += '          <span class="meta-tag" title="' + escapeHtml(b.remarks) + '">🏷️ ' + escapeHtml(remShort) + '</span>';
            }
            html += '          <span class="status-badge">';
            html += '            <span class="status-dot"></span>';
            html += '            ' + escapeHtml(b.status);
            html += '          </span>';
            html += '        </div>';
            html += '      </div>';
          });
          html += '    </div>';

          // Pagination
          if (totalPages > 1) {
            html += '    <div class="pagination">';
            html += '      <button id="firstPageBtn" class="page-btn"' + (page === 1 ? ' disabled' : '') + '>«</button>';
            html += '      <button id="prevPageBtn" class="page-btn"' + (page === 1 ? ' disabled' : '') + '>मागे</button>';
            html += '      <span style="margin: 0 0.5rem; font-size: 0.88rem; font-weight: 600;">पान ' + page + ' / ' + totalPages + '</span>';
            html += '      <button id="nextPageBtn" class="page-btn"' + (page === totalPages ? ' disabled' : '') + '>पुढे</button>';
            html += '      <button id="lastPageBtn" class="page-btn"' + (page === totalPages ? ' disabled' : '') + '>»</button>';
            html += '    </div>';
          }
        } else {
          html += '    <div class="empty-state">';
          html += '      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
          html += '      <h3>कोणतेही पुस्तक आढळले नाही</h3>';
          html += '      <p>कृपया वेगळा शोध शब्द किंवा विषय निवडून पुन्हा प्रयत्न करा.</p>';
          html += '    </div>';
        }

        html += '  </section>';
        html += '</main>';

        // Modal
        if (state.activeBook) {
          const ab = state.activeBook;
          html += '<div id="modalBackdrop" class="modal-backdrop">';
          html += '  <div class="modal-card">';
          html += '    <div class="modal-header">';
          html += '      <button id="modalCloseBtn" class="modal-close">✕</button>';
          html += '      <span class="acc-number" style="background: rgba(255,255,255,0.2); color: white;">नोंदणी क्र. #' + escapeHtml(ab.id) + '</span>';
          html += '      <h2 style="margin-top: 0.5rem; font-size: 1.35rem; line-height: 1.3;">' + escapeHtml(ab.title) + '</h2>';
          html += '    </div>';
          html += '    <div class="modal-body">';
          html += '      <div class="modal-row"><span class="modal-label">लेखक (Author):</span><span class="modal-val">' + escapeHtml(ab.author || 'अज्ञात') + '</span></div>';
          html += '      <div class="modal-row"><span class="modal-label">विषय (Subject):</span><span class="modal-val"><span class="subject-badge ' + getBadgeClass(ab.subject) + '">' + escapeHtml(ab.subject) + '</span></span></div>';
          html += '      <div class="modal-row"><span class="modal-label">सद्यस्थिती (Status):</span><span class="modal-val" style="color: #059669; font-weight: 700;">● ' + escapeHtml(ab.status) + '</span></div>';
          if (ab.pages) {
            html += '    <div class="modal-row"><span class="modal-label">पृष्ठसंख्या (Pages):</span><span class="modal-val">' + ab.pages + ' पाने</span></div>';
          }
          if (ab.remarks) {
            html += '    <div class="modal-row"><span class="modal-label">शेरा (Remarks):</span><span class="modal-val">' + escapeHtml(ab.remarks) + '</span></div>';
          }
          html += '      <div style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: flex-end;">';
          html += '        <button id="copyInfoBtn" class="btn btn-secondary" style="background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1;">📋 माहिती कॉपी करा</button>';
          html += '        <button id="closeModalBtn" class="btn" style="background: var(--primary); color: white;">बंद करा</button>';
          html += '      </div>';
          html += '    </div>';
          html += '  </div>';
          html += '</div>';
        }

        // Toast
        if (state.toastMsg) {
          html += '<div class="toast">' + escapeHtml(state.toastMsg) + '</div>';
        }

        root.innerHTML = html;

        // Attach Event Listeners
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.addEventListener('input', function(e) {
            setState({ searchTerm: e.target.value, currentPage: 1 });
            const freshInput = document.getElementById('searchInput');
            if (freshInput) {
              freshInput.focus();
              freshInput.setSelectionRange(freshInput.value.length, freshInput.value.length);
            }
          });
        }

        const clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) {
          clearBtn.addEventListener('click', function() {
            setState({ searchTerm: '', currentPage: 1 });
          });
        }

        const searchFieldSelect = document.getElementById('searchFieldSelect');
        if (searchFieldSelect) {
          searchFieldSelect.addEventListener('change', function(e) {
            setState({ searchField: e.target.value, currentPage: 1 });
          });
        }

        const sortSelect = document.getElementById('sortSelect');
        if (sortSelect) {
          sortSelect.addEventListener('change', function(e) {
            setState({ sortBy: e.target.value });
          });
        }

        const pageSizeSelect = document.getElementById('pageSizeSelect');
        if (pageSizeSelect) {
          pageSizeSelect.addEventListener('change', function(e) {
            setState({ pageSize: Number(e.target.value), currentPage: 1 });
          });
        }

        const fileUploadInput = document.getElementById('fileUploadInput');
        if (fileUploadInput) {
          fileUploadInput.addEventListener('change', function(e) { handleFileUpload(e); e.target.value = ''; });
        }

        const resetCategoryLink = document.getElementById('resetCategoryLink');
        if (resetCategoryLink) {
          resetCategoryLink.addEventListener('click', function() {
            setState({ selectedSubject: 'all', currentPage: 1 });
          });
        }

        document.querySelectorAll('.category-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const subj = btn.getAttribute('data-subject');
            setState({ selectedSubject: subj, currentPage: 1 });
          });
        });

        document.querySelectorAll('.book-card').forEach(function(card) {
          card.addEventListener('click', function() {
            const idx = parseInt(card.getAttribute('data-idx'));
            setState({ activeBook: filtered[idx] });
          });
        });

        const modalBackdrop = document.getElementById('modalBackdrop');
        if (modalBackdrop) {
          modalBackdrop.addEventListener('click', function(e) {
            if (e.target === modalBackdrop) setState({ activeBook: null });
          });
        }

        const modalCloseBtn = document.getElementById('modalCloseBtn');
        if (modalCloseBtn) {
          modalCloseBtn.addEventListener('click', function() { setState({ activeBook: null }); });
        }
        const closeModalBtn = document.getElementById('closeModalBtn');
        if (closeModalBtn) {
          closeModalBtn.addEventListener('click', function() { setState({ activeBook: null }); });
        }

        const copyInfoBtn = document.getElementById('copyInfoBtn');
        if (copyInfoBtn && state.activeBook) {
          copyInfoBtn.addEventListener('click', function() {
            const text = state.activeBook.title + ' - ' + state.activeBook.author + ' (Acc No: ' + state.activeBook.id + ')';
            navigator.clipboard.writeText(text);
            showToast('माहिती क्लिपबोर्डवर कॉपी झाली!');
          });
        }

        // Pagination buttons
        const firstPageBtn = document.getElementById('firstPageBtn');
        if (firstPageBtn) firstPageBtn.addEventListener('click', function() { setState({ currentPage: 1 }); });

        const prevPageBtn = document.getElementById('prevPageBtn');
        if (prevPageBtn) prevPageBtn.addEventListener('click', function() { setState({ currentPage: Math.max(1, state.currentPage - 1) }); });

        const nextPageBtn = document.getElementById('nextPageBtn');
        if (nextPageBtn) nextPageBtn.addEventListener('click', function() { setState({ currentPage: Math.min(totalPages, state.currentPage + 1) }); });

        const lastPageBtn = document.getElementById('lastPageBtn');
        if (lastPageBtn) lastPageBtn.addEventListener('click', function() { setState({ currentPage: totalPages }); });
      }

      // Initialize render on load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderApp);
      } else {
        renderApp();
      }
    })();
  </script>
</body>
</html>
